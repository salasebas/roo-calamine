---
name: pr-title

# Pull requests are squash-merged with their title as the commit message,
# and release-please reads those messages to pick the next version and write
# the CHANGELOG, so a title must be a Conventional Commit (`feat: ...`,
# `fix(reader): ...`, `feat!: ...`).

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    name: conventional-title
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check the pull request title
        uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
