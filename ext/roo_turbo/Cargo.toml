[package]
name = "roo_turbo"
version = "0.0.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
flate2 = "1.1.11"
magnus = { version = "0.9.3", features = ["rb-sys"] }
quick-xml = "0.42.0"
rb-sys = "0.9.130"

[dev-dependencies]
# Links libruby so `cargo test` can build this extension crate.
magnus = { version = "0.9.3", features = ["embed", "rb-sys"] }
